<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnout Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;font-family:'Noto Sans Thai',sans-serif;background:#fff}
#canvas{display:block;width:100%;height:100%}
#i18n-btn{position:fixed;top:14px;right:18px;z-index:9999;background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:12px;font-weight:700;font-family:'Noto Sans Thai',Arial,sans-serif;cursor:pointer;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background .15s}
#i18n-btn:hover{background:#444}
</style>
</head>
<body>
<button id="i18n-btn" onclick="setLang(window._i18nLang==='th'?'en':'th')">🇬🇧 EN</button>
<div style="height:100%;width:100%">
  <canvas id="canvas"></canvas>
</div>

<script>
var FINAL_TO = {BJT:175,PPP:85,PT:60,KT:55,DP:10};
var turnoutSnaps = [
  {t:'16:48', v:559,      p:0},
  {t:'16:58', v:559,      p:0},
  {t:'17:08', v:559,      p:0},
  {t:'17:18', v:559,      p:0},
  {t:'17:28', v:559,      p:0},
  {t:'17:38', v:771,      p:0},
  {t:'17:48', v:2477,     p:0},
  {t:'17:58', v:7202,     p:107},
  {t:'18:08', v:23940,    p:2704},
  {t:'18:18', v:60706,    p:9473},
  {t:'18:28', v:127518,   p:28246},
  {t:'18:38', v:234684,   p:73197},
  {t:'18:48', v:386813,   p:158338},
  {t:'18:58', v:583528,   p:300442},
  {t:'19:08', v:846558,   p:501969},
  {t:'19:18', v:1190289,  p:788083},
  {t:'19:28', v:1607272,  p:1139184},
  {t:'19:38', v:2094628,  p:1578130},
  {t:'19:43', v:2367193,  p:1813220},
  {t:'20:38', v:8016176,  p:7123672},
  {t:'20:49', v:9789994,  p:8883169},
  {t:'22:35', v:26843450, p:26447119},
  {t:'22:39', v:27213312, p:26842766},
  {t:'22:45', v:27764570, p:27435760},
  {t:'22:49', v:28819656, p:28479758},
  {t:'22:51', v:28995316, p:28661715},
  {t:'23:01', v:29805280, p:29508425},
  {t:'23:07', v:30228274, p:29992977},
  {t:'23:13', v:30632155, p:30383128},
  {t:'23:15', v:30753657, p:30519627},
  {t:'23:17', v:30866552, p:30636997},
  {t:'23:21', v:31084634, p:30868411},
  {t:'23:23', v:31189558, p:30994438},
  {t:'23:27', v:31371202, p:31178573},
  {t:'23:31', v:31566500, p:31369277},
  {t:'23:43', v:32001816, p:31867545},
  {t:'23:59', v:32465124, p:32344636},
  {t:'00:17+', v:32876585, p:32761489},
  {t:'00:33+', v:33189841, p:33087482},
  {t:'00:41+', v:33331360, p:33244650},
  {t:'01:01+', v:33626831, p:33540766},
  {t:'01:15+', v:33838568, p:33768802},
  {t:'01:59+', v:34162999, p:34120655},
  {t:'02:59+', v:34318732, p:34281188},
  {t:'03:59+', v:34389998, p:34349300},
  {t:'08:53+', v:34434497, p:34394820},
  {t:'15:51+', v:34527431, p:34489548}
];

(function(){
var snaps = turnoutSnaps;
var N = snaps.length;
var FINAL = FINAL_TO;
var D1 = 2, D2 = 4;

function M(v){ return parseFloat((v/1e6).toFixed(4)); }

var origLabels = snaps.map(function(s){return s.t;});
var labels = origLabels.slice(0,19)
  .concat(['',''])
  .concat(origLabels.slice(19,21))
  .concat(['','','',''])
  .concat(origLabels.slice(21));

var I_PRE_G1  = 18;
var I_POST_G1 = 21;
var I_PRE_G2  = 22;
var I_POST_G2 = 27;

function origIdx(li){
  if(li <= 18) return li;
  if(li <= 20) return null;
  if(li === 21) return 19;
  if(li === 22) return 20;
  if(li <= 26) return null;
  return li - (D1 + D2);
}

var N_EXT = labels.length;
var linV = [];
var linP = [];
for(var i=0;i<N_EXT;i++){
  var oi = origIdx(i);
  if(oi===null){
    linV.push(null); linP.push(null);
  } else {
    linV.push(M(snaps[oi].v));
    linP.push(M(snaps[oi].p));
  }
}

var betweenV = [], betweenP = [];
for(var i=0;i<N_EXT;i++){
  if(i===I_POST_G1 || i===I_PRE_G2){
    var oi=origIdx(i);
    betweenV.push(M(snaps[oi].v));
    betweenP.push(M(snaps[oi].p));
  } else { betweenV.push(null); betweenP.push(null); }
}

var stepG1V = [], stepG1P = [];
for(var i=0;i<N_EXT;i++){
  if(i>=I_PRE_G1 && i<=I_POST_G1){
    stepG1V.push(M(snaps[18].v));
    stepG1P.push(M(snaps[18].p));
  } else { stepG1V.push(null); stepG1P.push(null); }
}

var stepG2V = [], stepG2P = [];
for(var i=0;i<N_EXT;i++){
  if(i>=I_PRE_G2 && i<=I_POST_G2){
    stepG2V.push(M(snaps[20].v));
    stepG2P.push(M(snaps[20].p));
  } else { stepG2V.push(null); stepG2P.push(null); }
}

var prMain = [], prBetween = [];
for(var i=0;i<N_EXT;i++){
  var oi=origIdx(i);
  if(i===I_PRE_G1 || i===I_PRE_G2) prMain.push(5);
  else if(i===I_POST_G1 || i===I_POST_G2) prMain.push(0);
  else if(oi===null) prMain.push(0);
  else prMain.push(2.5);
  if(i===I_POST_G1 || i===I_PRE_G2) prBetween.push(4);
  else prBetween.push(0);
}
var prLinP = [];
for(var i=0;i<N_EXT;i++){
  var oi=origIdx(i);
  if(i===I_POST_G1||i===I_POST_G2||oi===null) prLinP.push(0);
  else prLinP.push(2);
}

var gapShadePlugin = {
  id:'gapShade',
  beforeDraw: function(chart){
    var ctx    = chart.ctx;
    var x      = chart.scales.x;
    var top    = chart.chartArea.top;
    var bottom = chart.chartArea.bottom;
    function shade(i0, i1, hex){
      var x0 = x.getPixelForValue(i0);
      var x1 = x.getPixelForValue(i1);
      ctx.save();
      ctx.fillStyle = hex + '18';
      ctx.fillRect(x0, top, x1 - x0, bottom - top);
      ctx.strokeStyle = hex;
      ctx.lineWidth   = 1.5;
      ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(x0, bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1, top); ctx.lineTo(x1, bottom); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    shade(I_PRE_G1, I_POST_G1, '#E67E22');
    shade(I_PRE_G2, I_POST_G2, '#C0392B');
  }
};

var ctx = document.getElementById('canvas');
new Chart(ctx, {
  type:'line',
  data:{
    labels:labels,
    datasets:[
      {label:'ส.ส.เขต',data:linV,borderColor:'#2E8B57',backgroundColor:'rgba(46,139,87,0.08)',tension:.35,pointRadius:prMain,pointBackgroundColor:'#2E8B57',pointBorderWidth:0,spanGaps:false,borderWidth:2},
      {label:'ส.ส.บัญชีรายชื่อ',data:linP,borderColor:'#E91E8C',backgroundColor:'rgba(233,30,140,0.08)',tension:.35,pointRadius:prMain,pointBackgroundColor:'#E91E8C',pointBorderWidth:0,spanGaps:false,borderWidth:2},
      {label:'ส.ส.เขต (ระหว่าง gap)',data:stepG1V,borderColor:'#2E8B57',borderDash:[8,4],tension:0,pointRadius:0,spanGaps:false,borderWidth:1.5,fill:false},
      {label:'ส.ส.บัญชีรายชื่อ (ระหว่าง gap)',data:stepG1P,borderColor:'#E91E8C',borderDash:[8,4],tension:0,pointRadius:0,spanGaps:false,borderWidth:1.5,fill:false},
      {label:'ส.ส.เขต (gap 2)',data:stepG2V,borderColor:'#2E8B57',borderDash:[8,4],tension:0,pointRadius:0,spanGaps:false,borderWidth:1.5,fill:false},
      {label:'ส.ส.บัญชีรายชื่อ (gap 2)',data:stepG2P,borderColor:'#E91E8C',borderDash:[8,4],tension:0,pointRadius:0,spanGaps:false,borderWidth:1.5,fill:false}
    ]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    plugins:{
      legend:{display:true,position:'top',labels:{font:{size:11},padding:12,boxWidth:12,usePointStyle:true,filter:function(item){return item.datasetIndex<2;}}},
      tooltip:{
        backgroundColor:'rgba(0,0,0,0.85)',
        padding:10,
        titleFont:{size:12,weight:'bold'},
        bodyFont:{size:11},
        displayColors:true,
        callbacks:{
          title:function(ctx){return ctx[0].label;},
          label:function(ctx){
            var oi=origIdx(ctx.dataIndex);
            var snap=snaps[oi];
            if(!snap) return ctx.dataset.label+': (gap)';
            var val = (ctx.dataset.label.indexOf('เขต')>-1) ? snap.v : snap.p;
            var m = M(val);
            var pct = ((val/34527431)*100).toFixed(2);
            return ctx.dataset.label+': '+m+'M ('+pct+'%)';
          },
          afterLabel:function(ctx){
            var oi=origIdx(ctx.dataIndex);
            if(oi===null) return '';
            if(ctx.datasetIndex===0 && oi>0){
              var prev=snaps[oi-1];
              var cur=snaps[oi];
              var delta = cur.v - prev.v;
              if(delta<0 || ctx.dataIndex===I_PRE_G1 || ctx.dataIndex===I_PRE_G2) return ' ⚠ GAP warning';
               }
            return '';
          }
        }
      }
    },
    scales:{
      y:{title:{display:true,text:'จำนวนผู้ใช้สิทธิ์ (ล้านคน)',font:{size:10}},ticks:{callback:function(v){return v.toFixed(1)+'M';},font:{size:10}},grid:{color:'rgba(0,0,0,0.06)'}},
      x:{ticks:{font:{size:10}},grid:{display:false}}
    }
  },
  plugins:[gapShadePlugin]
});
})();

// i18n mapping
var _lang = 'th';
var _map = {
  'ประชาชน':"People's Party",'ภูมิใจไทย':'Bhumjaithai','กล้าธรรม':'Kla Tham','เพื่อไทย':'Pheu Thai','ประชาธิปัตย์':'Democrat',
  'ส.ส.เขต':'Const. MPs','ส.ส.บัญชีรายชื่อ':'Party-list MPs',
  'ส.ส.เขต (ระหว่าง gap)':'Const. MPs (in gap)','ส.ส.บัญชีรายชื่อ (ระหว่าง gap)':'Party-list MPs (in gap)',
  'ส.ส.เขต (gap 2)':'Const. MPs (gap 2)','ส.ส.บัญชีรายชื่อ (gap 2)':'Party-list MPs (gap 2)',
  'จำนวนผู้ใช้สิทธิ์ (ล้านคน)':'Voters (millions)'
};

function setLang(lang){
  _lang = lang;
  window._i18nLang = lang;
  Object.values(Chart.instances).forEach(function(ch){
    if(!ch||!ch.data) return;
    (ch.data.datasets||[]).forEach(function(ds){
      if(!ds._origLabel) ds._origLabel = ds.label||'';
      ds.label = (lang==='en'&&_map[ds._origLabel]) ? _map[ds._origLabel] : ds._origLabel;
    });
    if(ch.options&&ch.options.scales){
      Object.values(ch.options.scales).forEach(function(sc){
        if(!sc.title) return;
        if(!sc.title._orig) sc.title._orig = sc.title.text||'';
        var orig = sc.title._orig;
        sc.title.text = (lang==='en'&&orig&&_map[orig]) ? _map[orig] : orig;
      });
    }
    try{ch.update('none');}catch(e){}
  });
  var btn = document.getElementById('i18n-btn');
  if(btn) btn.textContent = lang==='en'?'🇹🇭 TH':'🇬🇧 EN';
}
window.setLang = setLang;
window._i18nLang = 'th';
</script>
</body>
</html>
