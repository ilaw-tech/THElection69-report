<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Vote Decrease</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;font-family:'Noto Sans Thai',sans-serif;background:#fff}
#canvas{display:block;width:100%;height:100%}
#i18n-btn{position:fixed;top:14px;right:18px;z-index:9999;background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:12px;font-weight:700;font-family:'Noto Sans Thai',Arial,sans-serif;cursor:pointer;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background .15s}
#i18n-btn:hover{background:#444}
</style>
</head>
<body>
<button id="i18n-btn" onclick="setLang(window._i18nLang==='th'?'en':'th')">🇬🇧 EN</button>
<div style="height:100%;width:100%"><canvas id="canvas"></canvas></div>
<script>
var _i18nMap={
  'คะแนนที่ลดลงรวม':'Total decrease'
};
window._i18nLang='th';
function setLang(lang){window._i18nLang=lang;location.reload();}
function i18n(th){return window._i18nLang==='en'&&_i18nMap[th]?_i18nMap[th]:th;}

var partyDec=[{p:'ประชาชน',total:-49291,pct:-0.629},{p:'ภูมิใจไทย',total:-21344,pct:-0.214},{p:'กล้าธรรม',total:-16707,pct:-0.435},{p:'เพื่อไทย',total:-15852,pct:-0.275},{p:'ประชาธิปัตย์',total:-6598,pct:-0.328},{p:'รวมไทยฯ',total:-3977,pct:-0.306},{p:'เศรษฐกิจ',total:-3651,pct:-0.349},{p:'ประชาชาติ',total:-3190,pct:-0.402}];
new Chart(document.getElementById('canvas'),{type:'bar',data:{labels:partyDec.map(function(d){return d.p;}),datasets:[{label:i18n('คะแนนที่ลดลงรวม'),data:partyDec.map(function(d){return d.total;}),backgroundColor:'rgba(255,77,77,0.7)',borderRadius:3,borderWidth:0}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(i){var d=partyDec[i.dataIndex];return ' ลด '+Number(i.raw).toLocaleString()+' คะแนน'+(d?' ('+d.pct+'%)':'');}}}},scales:{x:{ticks:{callback:function(v){return v.toLocaleString();},font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'}},y:{ticks:{font:{size:11}},grid:{display:false}}}}});
</script>
</body>
</html>
