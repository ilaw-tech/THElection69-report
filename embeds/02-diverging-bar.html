<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diverging Bar Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;font-family:'Noto Sans Thai',sans-serif;background:#fff}
#canvas{display:block;width:100%;height:100%}
#i18n-btn{position:fixed;top:14px;right:18px;z-index:9999;background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:12px;font-weight:700;font-family:'Noto Sans Thai',Arial,sans-serif;cursor:pointer;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background .15s}
#i18n-btn:hover{background:#444}
</style>
</head>
<body>
<button id="i18n-btn" onclick="setLang(window._i18nLang==='th'?'en':'th')">🇬🇧 EN</button>
<div style="height:100%;width:100%">
  <canvas id="canvas"></canvas>
</div>

<script>
var ctx = document.getElementById('canvas');
new Chart(ctx, {
  type:'bar',
  data:{
    labels:['ภูมิใจไทย','เพื่อไทย','กล้าธรรม','ประชาธิปัตย์','ประชาชน'],
    datasets:[{
      label:'ผลต่าง % ณ 19:43 − final',
      data:[5.6,2.5,1.7,-2.0,-6.4],
      backgroundColor:['#185FA5CC','#E24B4ACC','#3B6D11CC','#378ADDCC','#E07B00CC'],
      borderRadius:4,borderWidth:0
    }]
  },
  options:{
    indexAxis:'y',
    responsive:true,
    maintainAspectRatio:false,
    plugins:{
      legend:{display:false},
      tooltip:{
        callbacks:{
          label:function(i){
            var s=i.raw>=0?'+':'';
            return ' '+s+i.raw+'% เทียบ final share';
          }
        }
      }
    },
    scales:{
      x:{
        min:-10,
        max:9,
        ticks:{
          callback:function(v){return(v>=0?'+':'')+v+'%';},
          font:{size:10}
        },
        grid:{color:'rgba(0,0,0,0.06)'}
      },
      y:{
        ticks:{font:{size:12},color:'#333'},
        grid:{display:false}
      }
    }
  }
});

var _lang = 'th';
var _map = {
  'ประชาชน':"People's Party",'ภูมิใจไทย':'Bhumjaithai','กล้าธรรม':'Kla Tham','เพื่อไทย':'Pheu Thai','ประชาธิปัตย์':'Democrat',
  'ผลต่าง % ณ 19:43 − final':'Deviation at 19:43 vs final'
};

function setLang(lang){
  _lang = lang;
  window._i18nLang = lang;
  Object.values(Chart.instances).forEach(function(ch){
    if(!ch||!ch.data) return;
    (ch.data.datasets||[]).forEach(function(ds){
      if(!ds._origLabel) ds._origLabel = ds.label||'';
      ds.label = (lang==='en'&&_map[ds._origLabel]) ? _map[ds._origLabel] : ds._origLabel;
    });
    if(ch.data.labels){
      if(!ch.data._origLabels) ch.data._origLabels = ch.data.labels.slice();
      ch.data.labels = ch.data._origLabels.map(function(l){return (lang==='en'&&_map[l]) ? _map[l] : l;});
    }
    try{ch.update('none');}catch(e){}
  });
  var btn = document.getElementById('i18n-btn');
  if(btn) btn.textContent = lang==='en'?'🇹🇭 TH':'🇬🇧 EN';
}
window.setLang = setLang;
window._i18nLang = 'th';
</script>
</body>
</html>
