<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipped Constituencies</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;font-family:'Noto Sans Thai',sans-serif;background:#fff}
#canvas{display:block;width:100%;height:100%}
#i18n-btn{position:fixed;top:14px;right:18px;z-index:9999;background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background .15s}
#i18n-btn:hover{background:#444}
</style>
</head>
<body>
<button id="i18n-btn" onclick="setLang(window._i18nLang==='th'?'en':'th')">🇬🇧 EN</button>
<div style="height:100%;width:100%"><canvas id="canvas"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script>
var flipData=[{t:'22:35',จ:'นนทบุรี',เ:4,from:'ภูมิใจไทย',to:'ประชาชน',col:'#E07B00'},{t:'22:35',จ:'ภูเก็ต',เ:1,from:'ภูมิใจไทย',to:'ประชาชน',col:'#E07B00'},{t:'22:35',จ:'สมุทรสาคร',เ:3,from:'กล้าธรรม',to:'ประชาชน',col:'#E07B00'},{t:'22:35',จ:'สมุทรสาคร',เ:1,from:'ประชาธิปัตย์',to:'ประชาชน',col:'#E07B00'},{t:'22:35',จ:'ราชบุรี',เ:5,from:'กล้าธรรม',to:'ภูมิใจไทย',col:'#185FA5'},{t:'22:35',จ:'เพชรบูรณ์',เ:2,from:'กล้าธรรม',to:'ภูมิใจไทย',col:'#185FA5'},{t:'22:35',จ:'เชียงใหม่',เ:5,from:'เพื่อไทย',to:'ประชาชน',col:'#E07B00'},{t:'22:35',จ:'นครพนม',เ:3,from:'เพื่อไทย',to:'ภูมิใจไทย',col:'#185FA5'},{t:'22:35',จ:'ร้อยเอ็ด',เ:4,from:'กล้าธรรม',to:'เพื่อไทย',col:'#E24B4A'},{t:'22:35',จ:'สงขลา',เ:8,from:'ภูมิใจไทย',to:'กล้าธรรม',col:'#3B6D11'},{t:'22:35',จ:'ขอนแก่น',เ:2,from:'กล้าธรรม',to:'ประชาชน',col:'#E07B00'},{t:'22:35',จ:'นครราชสีมา',เ:16,from:'เพื่อไทย',to:'ภูมิใจไทย',col:'#185FA5'},{t:'22:35',จ:'ชลบุรี',เ:7,from:'ภูมิใจไทย',to:'ประชาชน',col:'#E07B00'},{t:'22:35',จ:'ชลบุรี',เ:6,from:'ภูมิใจไทย',to:'ประชาชน',col:'#E07B00'},{t:'22:35',จ:'ปทุมธานี',เ:1,from:'เพื่อไทย',to:'ประชาชน',col:'#E07B00'},{t:'22:35',จ:'นนทบุรี',เ:5,from:'ภูมิใจไทย',to:'ประชาชน',col:'#E07B00'},{t:'22:35',จ:'ศรีสะเกษ',เ:6,from:'เพื่อไทย',to:'ภูมิใจไทย',col:'#185FA5'},{t:'23:01',จ:'นราธิวาส',เ:3,from:'กล้าธรรม',to:'ภูมิใจไทย',col:'#185FA5'},{t:'23:13',จ:'นครราชสีมา',เ:14,from:'เพื่อไทย',to:'ประชาชน',col:'#E07B00'},{t:'23:13',จ:'นครราชสีมา',เ:3,from:'เพื่อไทย',to:'ประชาชน',col:'#E07B00'},{t:'23:17',จ:'นครปฐม',เ:6,from:'ภูมิใจไทย',to:'ประชาชน',col:'#E07B00'},{t:'23:43',จ:'นนทบุรี',เ:8,from:'ภูมิใจไทย',to:'ประชาชน',col:'#E07B00'},{t:'00:17+',จ:'ชลบุรี',เ:2,from:'ภูมิใจไทย',to:'ประชาชน',col:'#E07B00'},{t:'00:33+',จ:'เชียงใหม่',เ:10,from:'เพื่อไทย',to:'กล้าธรรม',col:'#3B6D11'}];
var times=[...new Set(flipData.map(function(d){return d.t;}))];
var datasets=[];
var colors={ประชาชน:'#E07B00',ภูมิใจไทย:'#185FA5',กล้าธรรม:'#3B6D11',เพื่อไทย:'#E24B4A'};
Object.keys(colors).forEach(function(party){
  datasets.push({label:party+'ได้',data:times.map(function(t){var cnt=flipData.filter(function(d){return d.t===t&&d.to===party;}).reduce(function(s,d){return s+d.เ;},0);return cnt;}),backgroundColor:colors[party]+'BB',borderWidth:0,stack:'flip'});
});
var ctx=document.getElementById('canvas');
new Chart(ctx,{type:'bar',data:{labels:times,datasets:datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top',labels:{font:{size:10},padding:10,boxWidth:10}}},tooltip:{callbacks:{label:function(i){return' '+i.dataset.label+': '+i.raw+' เขต';}}}},scales:{x:{stacked:true,ticks:{font:{size:10}},grid:{display:false}},y:{stacked:true,title:{display:true,text:'เขตที่พลิก',font:{size:10}},ticks:{font:{size:10},stepSize:5},grid:{color:'rgba(0,0,0,0.04)'}}}}});
var _lang='th';var _map={'ประชาชนได้':"People's Party gained",'ภูมิใจไทยได้':'Bhumjaithai gained','กล้าธรรมได้':'Kla Tham gained','เพื่อไทยได้':'Pheu Thai gained'};
function setLang(lang){_lang=lang;window._i18nLang=lang;Object.values(Chart.instances).forEach(function(ch){if(!ch||!ch.data)return;(ch.data.datasets||[]).forEach(function(ds){if(!ds._origLabel)ds._origLabel=ds.label||'';ds.label=(lang==='en'&&_map[ds._origLabel])?_map[ds._origLabel]:ds._origLabel;});try{ch.update('none');}catch(e){}});var btn=document.getElementById('i18n-btn');if(btn)btn.textContent=lang==='en'?'🇹🇭 TH':'🇬🇧 EN';}
window.setLang=setLang;window._i18nLang='th';
</script>
</body>
</html>
