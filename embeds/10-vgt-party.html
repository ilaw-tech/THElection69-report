<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VGT by Party</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;font-family:'Noto Sans Thai',sans-serif;background:#fff}
#canvas{display:block;width:100%;height:100%}
#i18n-btn{position:fixed;top:14px;right:18px;z-index:9999;background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background .15s}
#i18n-btn:hover{background:#444}
</style>
</head>
<body>
<button id="i18n-btn" onclick="setLang(window._i18nLang==='th'?'en':'th')">🇬🇧 EN</button>
<div style="height:100%;width:100%"><canvas id="canvas"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script>
var VGT_PARTY=[{party:'ภูมิใจไทย',count:25},{party:'กล้าธรรม',count:8},{party:'เพื่อไทย',count:6},{party:'ประชาชน',count:6},{party:'ประชาธิปัตย์',count:3},{party:'พลังประชารัฐ',count:1}];
var pcols=['rgba(24,95,165,0.75)','rgba(59,109,17,0.75)','rgba(226,75,74,0.75)','rgba(224,123,0,0.75)','rgba(55,138,221,0.75)','rgba(136,136,136,0.75)'];
var ctx=document.getElementById('canvas');
new Chart(ctx,{type:'bar',data:{labels:VGT_PARTY.map(function(d){return d.party+' ('+d.count+')';}),datasets:[{label:'จำนวนเขต',data:VGT_PARTY.map(function(d){return d.count;}),backgroundColor:pcols,borderRadius:4,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(i){return' '+i.raw+' เขต';}}}},scales:{x:{ticks:{font:{size:11}},grid:{display:false}},y:{ticks:{stepSize:5,font:{size:9}},grid:{color:'rgba(0,0,0,0.04)'}}}}});
var _lang='th';var _map={'จำนวนเขต':'No. of constituencies'};
function setLang(lang){_lang=lang;window._i18nLang=lang;Object.values(Chart.instances).forEach(function(ch){if(!ch||!ch.data)return;(ch.data.datasets||[]).forEach(function(ds){if(!ds._origLabel)ds._origLabel=ds.label||'';ds.label=(lang==='en'&&_map[ds._origLabel])?_map[ds._origLabel]:ds._origLabel;});if(ch.options&&ch.options.scales){Object.values(ch.options.scales).forEach(function(sc){if(!sc.title)return;if(!sc.title._orig)sc.title._orig=sc.title.text||'';var orig=sc.title._orig;sc.title.text=(lang==='en'&&orig&&_map[orig])?_map[orig]:orig;});}try{ch.update('none');}catch(e){}});var btn=document.getElementById('i18n-btn');if(btn)btn.textContent=lang==='en'?'🇹🇭 TH':'🇬🇧 EN';}
window.setLang=setLang;window._i18nLang='th';
</script>
</body>
</html>
