<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VGT by Province</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;font-family:'Noto Sans Thai',sans-serif;background:#fff}
#canvas{display:block;width:100%;height:100%}
#i18n-btn{position:fixed;top:14px;right:18px;z-index:9999;background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background .15s}
#i18n-btn:hover{background:#444}
</style>
</head>
<body>
<button id="i18n-btn" onclick="setLang(window._i18nLang==='th'?'en':'th')">🇬🇧 EN</button>
<div style="height:100%;width:100%"><canvas id="canvas"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script>
var VGT_PROV=[{prov_name:'ร้อยเอ็ด',n:3,tot:9199},{prov_name:'สุรินทร์',n:3,tot:7988},{prov_name:'นครศรีธรรมราช',n:2,tot:7378},{prov_name:'ยโสธร',n:2,tot:6073},{prov_name:'นนทบุรี',n:3,tot:5538},{prov_name:'สุราษฎร์ธานี',n:1,tot:5422},{prov_name:'แพร่',n:1,tot:4883},{prov_name:'ชัยภูมิ',n:2,tot:3559},{prov_name:'กรุงเทพมหานคร',n:2,tot:3440},{prov_name:'พะเยา',n:2,tot:3246},{prov_name:'นราธิวาส',n:2,tot:2966},{prov_name:'ขอนแก่น',n:2,tot:2946},{prov_name:'อุบลราชธานี',n:1,tot:2775},{prov_name:'พัทลุง',n:1,tot:2552},{prov_name:'หนองบัวลำภู',n:2,tot:2510},{prov_name:'ศรีสะเกษ',n:2,tot:2119},{prov_name:'นครพนม',n:1,tot:2116},{prov_name:'มหาสารคาม',n:1,tot:2068},{prov_name:'กาญจนบุรี',n:1,tot:2049},{prov_name:'กาฬสินธุ์',n:2,tot:1772}];
var ctx=document.getElementById('canvas');
new Chart(ctx,{type:'bar',data:{labels:VGT_PROV.map(function(d){return d.prov_name+' ('+d.n+')';}),datasets:[{label:'excess รวม',data:VGT_PROV.map(function(d){return d.tot;}),backgroundColor:'rgba(142,68,173,0.75)',borderRadius:3,borderWidth:0}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(i){return' excess '+Number(i.raw).toLocaleString()+' คะแนน';}}}},scales:{x:{ticks:{font:{size:9}},grid:{color:'rgba(0,0,0,0.04)'}},y:{ticks:{font:{size:10}},grid:{display:false}}}}});
var _lang='th';var _map={'excess รวม':'Total excess'};
function setLang(lang){_lang=lang;window._i18nLang=lang;Object.values(Chart.instances).forEach(function(ch){if(!ch||!ch.data)return;(ch.data.datasets||[]).forEach(function(ds){if(!ds._origLabel)ds._origLabel=ds.label||'';ds.label=(lang==='en'&&_map[ds._origLabel])?_map[ds._origLabel]:ds._origLabel;});try{ch.update('none');}catch(e){}});var btn=document.getElementById('i18n-btn');if(btn)btn.textContent=lang==='en'?'🇹🇭 TH':'🇬🇧 EN';}
window.setLang=setLang;window._i18nLang='th';
</script>
</body>
</html>
