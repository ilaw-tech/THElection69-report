<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ballot Difference</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;font-family:'Noto Sans Thai',sans-serif;background:#fff}
#canvas{display:block;width:100%;height:100%}
#i18n-btn{position:fixed;top:14px;right:18px;z-index:9999;background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background .15s}
#i18n-btn:hover{background:#444}
</style>
</head>
<body>
<button id="i18n-btn" onclick="setLang(window._i18nLang==='th'?'en':'th')">🇬🇧 EN</button>
<div style="height:100%;width:100%"><canvas id="canvas"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script>
var bdL=['16:48','16:58','17:08','17:18','17:28','17:38','17:48','17:58','18:08','18:18','18:28','18:38','18:48','18:58','19:08','19:18','19:28','19:38','19:43','20:38','20:49','22:35','22:39','22:45','22:49','22:51','23:01','23:13'];
var bdD=[559,2477,21236,99272,228475,344589,468088,553973,892504,906825,396331,370546,328810,339898,333601,296855,249027,192629,134271,120488,115096,86710,69766,42344,37544,40698,39677,37883].map(function(v){return v/1000;});
var ctx=document.getElementById('canvas');
new Chart(ctx,{type:'bar',data:{labels:bdL,datasets:[{label:'ผลต่าง (บัตรเขต − บัตรลิสต์) พันใบ',data:bdD,backgroundColor:bdD.map(function(v){return v>500?'rgba(192,57,43,0.8)':v>200?'rgba(230,126,34,0.8)':'rgba(52,152,219,0.8)';}),borderColor:bdD.map(function(v){return v>500?'#C0392B':v>200?'#E67E22':'#2980B9';}),borderWidth:1,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(i){return' ผลต่าง: '+(i.raw*1000).toLocaleString()+' ใบ';}}}},scales:{x:{ticks:{font:{size:9},maxRotation:45,autoSkip:true,maxTicksLimit:16},grid:{display:false}},y:{title:{display:true,text:'พันใบ (×1,000)',font:{size:10}},ticks:{callback:function(v){return v+'K';},font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'}}}}});
var _lang='th';var _map={'ผลต่าง (บัตรเขต − บัตรลิสต์) พันใบ':'Gap (const.−party-list) thousands','พันใบ (×1,000)':'thousand ballots (×1,000)'};
function setLang(lang){_lang=lang;window._i18nLang=lang;Object.values(Chart.instances).forEach(function(ch){if(!ch||!ch.data)return;(ch.data.datasets||[]).forEach(function(ds){if(!ds._origLabel)ds._origLabel=ds.label||'';ds.label=(lang==='en'&&_map[ds._origLabel])?_map[ds._origLabel]:ds._origLabel;});if(ch.options&&ch.options.scales){Object.values(ch.options.scales).forEach(function(sc){if(!sc.title)return;if(!sc.title._orig)sc.title._orig=sc.title.text||'';var orig=sc.title._orig;sc.title.text=(lang==='en'&&orig&&_map[orig])?_map[orig]:orig;});}try{ch.update('none');}catch(e){}});var btn=document.getElementById('i18n-btn');if(btn)btn.textContent=lang==='en'?'🇹🇭 TH':'🇬🇧 EN';}
window.setLang=setLang;window._i18nLang='th';
</script>
</body>
</html>
