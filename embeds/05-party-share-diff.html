<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Share Difference</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;font-family:'Noto Sans Thai',sans-serif;background:#fff}
#canvas{display:block;width:100%;height:100%}
#i18n-btn{position:fixed;top:14px;right:18px;z-index:9999;background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:12px;font-weight:700;font-family:'Noto Sans Thai',Arial,sans-serif;cursor:pointer;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background .15s}
#i18n-btn:hover{background:#444}
</style>
</head>
<body>
<button id="i18n-btn" onclick="setLang(window._i18nLang==='th'?'en':'th')">🇬🇧 EN</button>
<div style="height:100%;width:100%">
  <canvas id="canvas"></canvas>
</div>

<script>
(function(){
  var labels=['16:48','17:38','17:48','17:58','18:08','18:18','18:28','18:38','18:48','18:58',
    '19:08','19:18','19:28','19:38','19:43','20:38','20:49','22:35','22:39','22:45',
    '22:49','22:51','23:01','23:07','23:13','23:31','23:59','00:17+','00:41+','01:15+',
    '01:59+','02:59+','03:59+','08:53+','15:51+'];
  var bjt=[17.7,26.8,42.5,39.2,42.7,42.9,39.0,37.4,37.4,37.7,38.0,37.7,37.3,37.0,36.9,35.2,34.9,32.5,32.4,32.3,32.3,32.2,32.1,32.0,31.9,31.7,31.6,31.5,31.5,31.4,31.4,31.4,31.3,31.3,31.3];
  var ppp=[16.4,17.3,14.4,15.3,16.7,16.5,17.1,17.6,17.8,18.0,18.1,18.1,18.1,18.1,18.2,19.6,19.8,22.6,22.8,22.9,22.9,23.0,23.2,23.3,23.4,23.7,24.0,24.1,24.2,24.4,24.5,24.5,24.6,24.6,24.6];
  var FBJT=31.3, FPPP=24.6;
  var dbjt=bjt.map(function(v){return parseFloat((v-FBJT).toFixed(2));});
  var dppp=ppp.map(function(v){return parseFloat((v-FPPP).toFixed(2));});
  var N=labels.length, G1=14, G2=20;
  var gapPlg={id:'gps',beforeDraw:function(ch){
    var ctx=ch.ctx,x=ch.scales.x,t=ch.chartArea.top,b=ch.chartArea.bottom;
    function sh(i,col){var x0=x.getPixelForValue(i);ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(x0,t);ctx.lineTo(x0,b);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
    sh(G1,'#E67E22');sh(G2,'#C0392B');
  }};
  new Chart(document.getElementById('canvas'),{
    type:'line',plugins:[gapPlg],
    data:{labels:labels,datasets:[
      {label:'ภูมิใจไทย (final 31.3%)',data:dbjt,borderColor:'#1F4E79',backgroundColor:'rgba(31,78,121,0.07)',
       borderWidth:2.5,pointRadius:1.5,fill:true,tension:0.3},
      {label:'ประชาชน (final 24.6%)',data:dppp,borderColor:'#E07B00',backgroundColor:'rgba(224,123,0,0.05)',
       borderWidth:2.5,pointRadius:1.5,fill:true,tension:0.3},
      {label:'',data:labels.map(function(){return 0;}),borderColor:'#888',borderWidth:1,borderDash:[6,4],pointRadius:0,fill:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,position:'top',labels:{font:{size:11},boxWidth:12}},
        tooltip:{callbacks:{
          title:function(it){return (it&&it.length&&labels[it[0].dataIndex])||'';},
          label:function(i){if(!i.dataset.label)return null;return ' '+i.dataset.label+': '+(i.raw>=0?'+':'')+i.raw+'%';}
        }}
      },
      scales:{
        x:{ticks:{font:{size:9},maxRotation:50,autoSkip:true,maxTicksLimit:18},grid:{color:'rgba(0,0,0,0.03)'}},
        y:{ticks:{callback:function(v){return(v>=0?'+':'')+v+'%';},font:{size:9}},
           grid:{color:'rgba(0,0,0,0.04)'},min:-15,max:15,
           title:{display:true,text:'ผลต่างจาก final share',font:{size:9}}}
      }
    }
  });
})();

var _lang='th';
var _map={'ภูมิใจไทย (final 31.3%)':'Bhumjaithai (final 31.3%)','ประชาชน (final 24.6%)':"People's Party (final 24.6%)",'ผลต่างจาก final share':'Deviation from final share'};
function setLang(lang){_lang=lang;window._i18nLang=lang;Object.values(Chart.instances).forEach(function(ch){if(!ch||!ch.data)return;(ch.data.datasets||[]).forEach(function(ds){if(!ds._origLabel)ds._origLabel=ds.label||'';ds.label=(lang==='en'&&_map[ds._origLabel])?_map[ds._origLabel]:ds._origLabel;});if(ch.options&&ch.options.scales){Object.values(ch.options.scales).forEach(function(sc){if(!sc.title)return;if(!sc.title._orig)sc.title._orig=sc.title.text||'';var orig=sc.title._orig;sc.title.text=(lang==='en'&&orig&&_map[orig])?_map[orig]:orig;});}try{ch.update('none');}catch(e){}});var btn=document.getElementById('i18n-btn');if(btn)btn.textContent=lang==='en'?'🇹🇭 TH':'🇬🇧 EN';}
window.setLang=setLang;window._i18nLang='th';
</script>
</body>
</html>
